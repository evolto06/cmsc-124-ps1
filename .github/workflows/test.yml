name: ps1-checks
on: [push]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - run: chmod +x build.sh run check.sh

      # check.sh is the complete public automated check. It builds the project
      # and runs the published corpus. It repeats the corpus with both sanitizers.
      - run: ./check.sh
